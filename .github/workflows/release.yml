name: Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare release metadata
        id: release_metadata
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' androidApp/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' androidApp/build.gradle.kts | head -n 1)
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from androidApp/build.gradle.kts."
            exit 1
          fi
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionCode from androidApp/build.gradle.kts."
            exit 1
          fi

          TAG_NAME="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          RELEASE_NAME="Sonic Signature ${VERSION_NAME} build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          {
            echo "tag_name=$TAG_NAME"
            echo "release_name=$RELEASE_NAME"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE secret is not set or is empty. Cannot sign the APK."
            exit 1
          fi

          KEYSTORE_FILE=$(mktemp /tmp/release-XXXXXX.keystore)
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for secret_name in KEYSTORE_PATH KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::${secret_name} is not set or is empty. Cannot sign the APK."
              exit 1
            fi
          done

          ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: |
          if [ -n "$KEYSTORE_FILE" ] && [ -f "$KEYSTORE_FILE" ]; then
            rm -f "$KEYSTORE_FILE"
          fi

      - name: List generated APKs
        run: find androidApp/build/outputs/apk/release/ -maxdepth 1 -name "*.apk" -print

      - name: Prepare APK artifact
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release/ -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK found."
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK_PATH" "artifacts/Sonic-Signature-${{ steps.release_metadata.outputs.tag_name }}.apk"
          ls -l artifacts/

      - name: Generate changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges > changelog.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges > changelog.md
          fi

          if [ ! -s changelog.md ]; then
            echo "- No commits found." > changelog.md
          fi

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release_metadata.outputs.tag_name }}" -m "${{ steps.release_metadata.outputs.release_name }}"
          git push origin "${{ steps.release_metadata.outputs.tag_name }}"

      - name: Prepare release notes
        run: |
          cat > release-notes.md <<EOF
          Production APK build from main.

          Version: ${{ steps.release_metadata.outputs.version_name }}
          Version code: ${{ steps.release_metadata.outputs.version_code }}
          Commit: ${{ steps.release_metadata.outputs.short_sha }}
          Tag: ${{ steps.release_metadata.outputs.tag_name }}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## What's changed

          EOF
          cat changelog.md >> release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sonic-Signature-release-apk-${{ steps.release_metadata.outputs.tag_name }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_metadata.outputs.release_name }}
          body_path: release-notes.md
          files: artifacts/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
